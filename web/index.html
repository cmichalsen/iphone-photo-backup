<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Photo Backup</title>
<style>
  :root { color-scheme: light dark; --bg:#fff; --fg:#111; --muted:#666; --bar:#f4f4f6; --line:#ddd; --accent:#0a84ff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#000; --fg:#f2f2f2; --muted:#999; --bar:#1c1c1e; --line:#333; } }
  * { box-sizing: border-box; }
  [hidden] { display:none !important; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px -apple-system, system-ui, "Segoe UI", sans-serif; }
  header { position:sticky; top:0; z-index:2; background:var(--bar); border-bottom:1px solid var(--line);
           padding:10px 12px; padding-top:max(10px, env(safe-area-inset-top)); display:flex; gap:8px; align-items:center; }
  header select, header button { font-size:16px; padding:8px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--fg); min-width:0; }
  header button.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  #view { flex:1; }
  #banner { display:block; margin:8px 12px 0; padding:10px 12px; border-radius:10px; background:var(--bar); border:1px solid var(--line);
            color:var(--fg); font-size:14px; text-decoration:none; }
  #banner b { color:var(--accent); }
  #info { padding:8px 12px; color:var(--muted); font-size:14px; }
  #grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(104px, 1fr)); gap:2px; padding:0 2px; }
  #grid h2 { grid-column:1 / -1; margin:0; padding:14px 10px 6px; font-size:16px; font-weight:600; }
  #more { height:120px; }
  .tile { position:relative; aspect-ratio:1; background:var(--bar); overflow:hidden; border:0; padding:0; cursor:pointer; }
  .tile img { width:100%; height:100%; object-fit:cover; display:block; }
  .tile .badge { position:absolute; right:4px; bottom:4px; background:rgba(0,0,0,.6); color:#fff; font-size:11px; padding:1px 5px; border-radius:4px; }
  .tile .name { position:absolute; inset:0; display:none; align-items:center; justify-content:center; text-align:center;
                font-size:11px; color:var(--muted); padding:4px; word-break:break-all; }
  .tile.nothumb .name { display:flex; } .tile.nothumb img { display:none; }
  .tile.sel img { opacity:.55; }
  .tile.sel::after { content:"✓"; position:absolute; left:5px; top:5px; width:24px; height:24px; border-radius:50%;
                     background:var(--accent); color:#fff; font-size:15px; line-height:24px; text-align:center; }
  #selbar { position:fixed; left:0; right:0; bottom:0; z-index:3; display:flex; gap:8px; align-items:center;
            padding:10px 12px; padding-bottom:max(10px, env(safe-area-inset-bottom)); background:var(--bar); border-top:1px solid var(--line); }
  #selbar span { flex:1; min-width:0; font-size:14px; }
  #viewer { position:fixed; inset:0; z-index:5; background:#000; color:#fff; display:none; flex-direction:column; }
  #viewer.open { display:flex; }
  #stage { flex:1; min-height:0; display:flex; align-items:center; justify-content:center; }
  #stage img, #stage video { max-width:100%; max-height:100%; object-fit:contain; }
  #vTitle { font-size:13px; color:#bbb; text-align:center; padding:6px 12px 0; background:#111; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #hint { font-size:12px; color:#999; text-align:center; padding:2px 12px 0; background:#111; }
  #vbar { display:flex; gap:8px; align-items:center; padding:10px 12px; padding-bottom:max(10px, env(safe-area-inset-bottom)); background:#111; }
  #vbar .gap { flex:1; }
  .btn { font-size:16px; padding:9px 13px; border-radius:8px; border:0; background:#2c2c2e; color:#fff; text-decoration:none; white-space:nowrap; }
  .btn.primary { background:var(--accent); }
  .btn:disabled { opacity:.5; }
  #toast { position:fixed; left:50%; bottom:90px; transform:translateX(-50%); z-index:9; background:rgba(40,40,42,.95); color:#fff;
           padding:10px 16px; border-radius:20px; font-size:14px; max-width:90%; text-align:center; }
</style>
</head>
<body>
<header>
  <select id="view" aria-label="What to show"></select>
  <select id="sort" aria-label="Sort order">
    <option value="new">Newest first</option>
    <option value="old">Oldest first</option>
  </select>
  <button id="selToggle" hidden>Select</button>
</header>
<a id="banner" hidden></a>
<div id="info">Loading…</div>
<div id="grid"></div>
<div id="more"></div>

<div id="selbar" hidden>
  <span id="selText"></span>
  <button class="btn primary" id="selSave" disabled>Save to Photos</button>
  <button class="btn" id="selCancel">Cancel</button>
</div>

<div id="viewer">
  <div id="stage"></div>
  <div id="vTitle"></div>
  <div id="hint"></div>
  <div id="vbar">
    <button class="btn" id="vPrev" aria-label="Previous">&#8249;</button>
    <button class="btn" id="vNext" aria-label="Next">&#8250;</button>
    <span class="gap"></span>
    <button class="btn primary" id="vSave" hidden>Save to Photos</button>
    <a class="btn" id="vDownload">Download</a>
    <button class="btn" id="vClose">Close</button>
  </div>
</div>
<div id="toast" hidden></div>

<script>
const $ = id => document.getElementById(id);
const enc = p => p.split('/').map(encodeURIComponent).join('/');
const size = b => b >= 1<<30 ? (b/(1<<30)).toFixed(2)+' GB' : (b/(1<<20)).toFixed(1)+' MB';
const nameOf = p => p.slice(p.lastIndexOf('/') + 1);
const folderOf = p => p.includes('/') ? p.slice(0, p.lastIndexOf('/')) : '';
// Capture times are the phone's local wall-clock time, so format them as UTC to avoid shifting them.
const monthFmt = new Intl.DateTimeFormat(undefined, { month:'long', year:'numeric', timeZone:'UTC' });
const dateFmt = new Intl.DateTimeFormat(undefined, { dateStyle:'medium', timeStyle:'short', timeZone:'UTC' });
const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const PAGE = 240;
const MB = 1048576;
const MAX_SHARE = 150 * MB;        // biggest single file handed to the share sheet (it is held in memory)
const MAX_BATCH = 50, MAX_BATCH_BYTES = 600 * MB;

// The share sheet ("Save Image" / "Save 5 Images") only works on a secure (https) page.
const canShareFiles = (() => {
  try { return window.isSecureContext && !!navigator.canShare && navigator.canShare({ files: [new File(['x'], 'a.jpg', { type: 'image/jpeg' })] }); }
  catch { return false; }
})();

let all = [], list = [], shown = 0, lastHeading = '', current = -1;
let viewFile = null, viewUrl = null;
let selecting = false;
const selected = new Map();   // path -> item
const ready = new Map();      // path -> File, fetched and ready to share

let toastTimer;
function toast(text) {
  $('toast').textContent = text; $('toast').hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => $('toast').hidden = true, 3500);
}

async function fetchFile(it) {
  const res = await fetch('/file/' + enc(it.p));
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const blob = await res.blob();
  return new File([blob], nameOf(it.p), { type: blob.type || 'application/octet-stream' });
}

// navigator.share must be called directly from the tap, so files are always fetched beforehand.
function share(files, done) {
  navigator.share({ files }).then(() => { toast(files.length > 1 ? `${files.length} items sent to Photos` : 'Sent to Photos'); done(); })
    .catch(e => { if (e.name !== 'AbortError') toast('Could not open the share sheet: ' + e.message); });
}

async function load() {
  if (canShareFiles) $('selToggle').hidden = false;
  else if (isIOS && location.protocol === 'http:') showSecureBanner();

  const res = await fetch('/api/all');
  if (!res.ok) { $('info').textContent = 'Could not load the photo list.'; return; }
  all = await res.json();
  if (!all.length) { $('info').textContent = 'No photos found in the backup folder.'; return; }

  const folders = new Map();
  for (const it of all) { const f = folderOf(it.p); folders.set(f, (folders.get(f) || 0) + 1); }
  const isYear = f => /^\d{4}/.test(f);
  const keys = [...folders.keys()].sort((a, b) => (isYear(b) - isYear(a)) || b.localeCompare(a));
  const photos = all.filter(i => i.k === 'i').length;
  $('view').innerHTML =
    `<option value="photos">All photos (${photos})</option>` +
    `<option value="videos">All videos (${all.length - photos})</option>` +
    `<option value="everything">Everything (${all.length})</option>` +
    `<optgroup label="By folder">` +
    keys.map(k => `<option value="f:${k}">${(k.split('/').pop() || 'top folder')} (${folders.get(k)})</option>`).join('') +
    `</optgroup>`;

  const [v, s] = decodeURIComponent(location.hash.slice(1)).split('|');
  if ([...$('view').options].some(o => o.value === v)) $('view').value = v;
  if (s === 'old' || s === 'new') $('sort').value = s;
  show();
}

async function showSecureBanner() {
  try {
    const { httpsPort } = await (await fetch('/api/config')).json();
    const b = $('banner');
    b.href = `https://${location.hostname}:${httpsPort}/`;
    b.innerHTML = '<b>Tap here for one-tap Save to Photos and multi-select.</b> It opens the secure address. ' +
                  'Safari warns once that the connection is not private: choose Show Details, then “visit this website”.';
    b.hidden = false;
  } catch { /* banner is optional */ }
}

function show() {
  const view = $('view').value, dir = $('sort').value === 'old' ? 1 : -1;
  history.replaceState(null, '', '#' + encodeURIComponent(view + '|' + $('sort').value));
  list = all.filter(view === 'photos' ? i => i.k === 'i'
                  : view === 'videos' ? i => i.k === 'v'
                  : view === 'everything' ? () => true
                  : i => folderOf(i.p) === view.slice(2));
  list.sort((a, b) => dir * (a.t - b.t) || dir * a.p.localeCompare(b.p));
  const vids = list.filter(i => i.k === 'v').length;
  const total = list.reduce((s, i) => s + i.s, 0);
  $('info').textContent = `${list.length - vids} photos, ${vids} videos, ${size(total)}`;
  $('grid').innerHTML = '';
  shown = 0; lastHeading = '';
  window.scrollTo(0, 0);
  renderMore();
}

function renderMore() {
  const frag = document.createDocumentFragment();
  const end = Math.min(list.length, shown + PAGE);
  for (let i = shown; i < end; i++) {
    const it = list[i];
    const heading = it.t < 631152000 ? 'Unknown date' : monthFmt.format(it.t * 1000); // before 1990 = no real date
    if (heading !== lastHeading) {
      const h = document.createElement('h2'); h.textContent = heading; frag.append(h);
      lastHeading = heading;
    }
    const b = document.createElement('button');
    b.className = 'tile' + (selected.has(it.p) ? ' sel' : '');
    b.onclick = () => selecting ? toggleSelect(it, b) : openViewer(i);
    const img = document.createElement('img');
    img.loading = 'lazy'; img.decoding = 'async'; img.alt = nameOf(it.p);
    img.src = '/thumb/' + enc(it.p);
    img.onerror = () => b.classList.add('nothumb');
    b.append(img);
    const n = document.createElement('span'); n.className = 'name'; n.textContent = nameOf(it.p); b.append(n);
    if (it.k === 'v') { const v = document.createElement('span'); v.className = 'badge'; v.textContent = '▶ video'; b.append(v); }
    frag.append(b);
  }
  shown = end;
  $('grid').append(frag);
}

new IntersectionObserver(entries => {
  if (entries[0].isIntersecting && shown < list.length) renderMore();
}, { rootMargin: '1200px' }).observe($('more'));

// ---- multi-select ----

function setSelecting(on) {
  selecting = on;
  $('selToggle').classList.toggle('on', on);
  $('selbar').hidden = !on;
  if (!on) {
    selected.clear(); ready.clear();
    document.querySelectorAll('.tile.sel').forEach(t => t.classList.remove('sel'));
  }
  updateSelBar();
}

function toggleSelect(it, tile) {
  if (selected.has(it.p)) {
    selected.delete(it.p); ready.delete(it.p); tile.classList.remove('sel');
  } else {
    const bytes = [...selected.values()].reduce((s, i) => s + i.s, 0);
    if (it.s > MAX_SHARE) return toast(`${nameOf(it.p)} is ${size(it.s)}, too big to save this way. Open it and use Download.`);
    if (selected.size >= MAX_BATCH) return toast(`Save up to ${MAX_BATCH} at a time.`);
    if (bytes + it.s > MAX_BATCH_BYTES) return toast(`That would be over ${size(MAX_BATCH_BYTES)} in one go. Save these first.`);
    selected.set(it.p, it); tile.classList.add('sel');
    fetchFile(it).then(f => { if (selected.has(it.p)) { ready.set(it.p, f); updateSelBar(); } })
      .catch(() => { selected.delete(it.p); tile.classList.remove('sel'); updateSelBar(); toast('Could not load ' + nameOf(it.p)); });
  }
  updateSelBar();
}

function updateSelBar() {
  const n = selected.size, r = [...selected.keys()].filter(p => ready.has(p)).length;
  $('selText').textContent = n === 0 ? 'Tap photos to select' : r < n ? `${n} selected, getting ${n - r}…` : `${n} selected`;
  $('selSave').disabled = n === 0 || r < n;
}

$('selToggle').onclick = () => setSelecting(!selecting);
$('selCancel').onclick = () => setSelecting(false);
$('selSave').onclick = () => share([...selected.keys()].map(p => ready.get(p)), () => setSelecting(false));

// ---- viewer ----

function openViewer(i) {
  resetViewer();
  current = i;
  const it = list[i], url = '/file/' + enc(it.p);
  const stage = $('stage'), saveBtn = $('vSave');
  const shareable = canShareFiles && it.s <= MAX_SHARE;
  $('vTitle').textContent = `${it.t < 631152000 ? 'Unknown date' : dateFmt.format(it.t * 1000)} · ${nameOf(it.p)} · ${size(it.s)}`;
  $('vDownload').href = url + '?dl=1';
  $('vDownload').hidden = shareable;
  saveBtn.hidden = !shareable;
  $('hint').textContent = '';

  if (it.k === 'v') {
    const v = document.createElement('video');
    v.controls = true; v.playsInline = true; v.preload = 'metadata'; v.src = url;
    stage.append(v);
    saveBtn.textContent = 'Save to Photos'; saveBtn.disabled = false;
    if (!shareable && isIOS) $('hint').textContent = 'To save: Download, then open it from the downloads arrow, tap Share, Save Video.';
  } else {
    const img = document.createElement('img');
    img.alt = nameOf(it.p);
    // Show the original where the browser can (Safari shows HEIC); otherwise fall back to a converted JPEG.
    img.onerror = () => { img.onerror = null; img.src = '/preview/' + enc(it.p); };
    stage.append(img);
    if (shareable) {
      prepare(it, f => { viewUrl = URL.createObjectURL(f); img.src = viewUrl; }, () => { img.src = url; });
    } else {
      img.src = url;
      if (isIOS) $('hint').textContent = 'To save: touch and hold the photo, then Save to Photos.';
    }
  }
  $('viewer').classList.add('open');
  document.body.style.overflow = 'hidden';
  if (i >= shown - 1 && shown < list.length) renderMore();
}

// Fetches the open item so the Save button can hand it to the share sheet the moment it is tapped.
function prepare(it, onReady, onFail) {
  const btn = $('vSave');
  btn.textContent = 'Getting…'; btn.disabled = true;
  fetchFile(it).then(f => {
    if (list[current] !== it || !$('viewer').classList.contains('open')) return;
    viewFile = f;
    btn.textContent = 'Save to Photos'; btn.disabled = false;
    if (onReady) onReady(f);
  }).catch(() => {
    if (list[current] !== it) return;
    btn.hidden = true; $('vDownload').hidden = false;
    if (onFail) onFail();
  });
}

$('vSave').onclick = () => {
  const it = list[current];
  if (viewFile) return share([viewFile], closeViewer);
  // Videos are only fetched when asked for; a second tap then opens the share sheet.
  prepare(it, () => { $('vSave').textContent = 'Ready: tap to save'; });
};

function resetViewer() {
  $('stage').innerHTML = '';
  if (viewUrl) URL.revokeObjectURL(viewUrl);
  viewUrl = null; viewFile = null;
}

function closeViewer() {
  resetViewer();
  current = -1;
  $('viewer').classList.remove('open');
  document.body.style.overflow = '';
}

function step(d) { const n = current + d; if (n >= 0 && n < list.length) openViewer(n); }

$('view').onchange = show;
$('sort').onchange = show;
$('vClose').onclick = closeViewer;
$('vPrev').onclick = () => step(-1);
$('vNext').onclick = () => step(1);
document.addEventListener('keydown', e => {
  if (!$('viewer').classList.contains('open')) return;
  if (e.key === 'Escape') closeViewer();
  if (e.key === 'ArrowLeft') step(-1);
  if (e.key === 'ArrowRight') step(1);
});
load();
</script>
</body>
</html>
