<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Photo Backup</title>
<style>
  :root { color-scheme: light dark; --bg:#fff; --fg:#111; --muted:#666; --bar:#f4f4f6; --line:#ddd; --accent:#0a84ff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#000; --fg:#f2f2f2; --muted:#999; --bar:#1c1c1e; --line:#333; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px -apple-system, system-ui, "Segoe UI", sans-serif; }
  header { position:sticky; top:0; z-index:2; background:var(--bar); border-bottom:1px solid var(--line);
           padding:10px 12px; padding-top:max(10px, env(safe-area-inset-top)); display:flex; gap:8px; align-items:center; }
  header select { flex:1; min-width:0; font-size:16px; padding:8px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--fg); }
  header button { font-size:16px; padding:8px 12px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--fg); }
  #info { padding:8px 12px; color:var(--muted); font-size:14px; }
  #grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(104px, 1fr)); gap:2px; padding:0 2px 40px; }
  .tile { position:relative; aspect-ratio:1; background:var(--bar); overflow:hidden; border:0; padding:0; cursor:pointer; }
  .tile img { width:100%; height:100%; object-fit:cover; display:block; }
  .tile .badge { position:absolute; right:4px; bottom:4px; background:rgba(0,0,0,.6); color:#fff; font-size:11px; padding:1px 5px; border-radius:4px; }
  .tile .name { position:absolute; inset:0; display:none; align-items:center; justify-content:center; text-align:center;
                font-size:11px; color:var(--muted); padding:4px; word-break:break-all; }
  .tile.nothumb .name { display:flex; } .tile.nothumb img { display:none; }
  #viewer { position:fixed; inset:0; z-index:5; background:#000; color:#fff; display:none; flex-direction:column; }
  #viewer.open { display:flex; }
  #stage { flex:1; min-height:0; display:flex; align-items:center; justify-content:center; }
  #stage img, #stage video { max-width:100%; max-height:100%; object-fit:contain; }
  #vbar { display:flex; gap:8px; align-items:center; padding:10px 12px; padding-bottom:max(10px, env(safe-area-inset-bottom)); background:#111; }
  #vbar .title { flex:1; min-width:0; font-size:13px; color:#bbb; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #vbar button, #vbar a { font-size:16px; padding:9px 13px; border-radius:8px; border:0; background:#2c2c2e; color:#fff; text-decoration:none; }
  #vbar a.primary { background:var(--accent); }
  #hint { font-size:12px; color:#999; text-align:center; padding:4px 12px 0; background:#111; }
</style>
</head>
<body>
<header>
  <select id="month" aria-label="Month"></select>
  <button id="prevM" aria-label="Newer month">&#8249;</button>
  <button id="nextM" aria-label="Older month">&#8250;</button>
</header>
<div id="info">Loading…</div>
<div id="grid"></div>

<div id="viewer">
  <div id="stage"></div>
  <div id="hint"></div>
  <div id="vbar">
    <button id="vPrev" aria-label="Previous">&#8249;</button>
    <button id="vNext" aria-label="Next">&#8250;</button>
    <span class="title" id="vTitle"></span>
    <a class="primary" id="vDownload">Download</a>
    <button id="vClose">Close</button>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const enc = p => p.split('/').map(encodeURIComponent).join('/');
const size = b => b >= 1<<30 ? (b/(1<<30)).toFixed(2)+' GB' : (b/(1<<20)).toFixed(1)+' MB';
const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
let items = [], month = '', current = -1;

async function loadMonths() {
  const months = await (await fetch('/api/months')).json();
  if (!months.length) { $('info').textContent = 'No photos found in the backup folder.'; return; }
  $('month').innerHTML = months.map(m => `<option value="${m.key}">${m.key.split('/').pop()} (${m.count})</option>`).join('');
  const wanted = decodeURIComponent(location.hash.slice(1));
  if (months.some(m => m.key === wanted)) $('month').value = wanted;
  loadMonth();
}

async function loadMonth() {
  month = $('month').value;
  history.replaceState(null, '', '#' + encodeURIComponent(month));
  $('info').textContent = 'Loading…';
  $('grid').innerHTML = '';
  const res = await fetch('/api/list?month=' + encodeURIComponent(month));
  items = res.ok ? await res.json() : [];
  const total = items.reduce((s, i) => s + i.size, 0);
  const vids = items.filter(i => i.kind === 'video').length;
  $('info').textContent = `${items.length - vids} photos, ${vids} videos, ${size(total)}`;
  const frag = document.createDocumentFragment();
  items.forEach((it, i) => {
    const b = document.createElement('button');
    b.className = 'tile';
    b.onclick = () => openViewer(i);
    const img = document.createElement('img');
    img.loading = 'lazy'; img.decoding = 'async'; img.alt = it.name;
    img.src = `/thumb/${enc(month)}/${encodeURIComponent(it.name)}`;
    img.onerror = () => b.classList.add('nothumb');
    b.append(img);
    const n = document.createElement('span'); n.className = 'name'; n.textContent = it.name; b.append(n);
    if (it.kind === 'video') { const v = document.createElement('span'); v.className = 'badge'; v.textContent = '▶ video'; b.append(v); }
    frag.append(b);
  });
  $('grid').append(frag);
  window.scrollTo(0, 0);
}

function openViewer(i) {
  current = i;
  const it = items[i], url = `/file/${enc(month)}/${encodeURIComponent(it.name)}`;
  const stage = $('stage');
  stage.innerHTML = '';
  if (it.kind === 'video') {
    const v = document.createElement('video');
    v.controls = true; v.playsInline = true; v.preload = 'metadata'; v.src = url;
    stage.append(v);
    $('hint').textContent = isIOS ? 'To save: Download, then open it from the downloads arrow, tap Share, Save Video.' : '';
  } else {
    const img = document.createElement('img');
    img.alt = it.name;
    // Show the original where the browser can (Safari shows HEIC); otherwise fall back to a converted JPEG.
    img.onerror = () => { img.onerror = null; img.src = `/preview/${enc(month)}/${encodeURIComponent(it.name)}`; };
    img.src = url;
    stage.append(img);
    $('hint').textContent = isIOS ? 'To save: touch and hold the photo, then Save to Photos.' : '';
  }
  $('vTitle').textContent = `${it.name} · ${size(it.size)}`;
  $('vDownload').href = url + '?dl=1';
  $('viewer').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeViewer() {
  $('stage').innerHTML = '';
  $('viewer').classList.remove('open');
  document.body.style.overflow = '';
}

function step(d) { const n = current + d; if (n >= 0 && n < items.length) openViewer(n); }
function stepMonth(d) {
  const s = $('month'), n = s.selectedIndex + d;
  if (n >= 0 && n < s.options.length) { s.selectedIndex = n; loadMonth(); }
}

$('month').onchange = loadMonth;
$('prevM').onclick = () => stepMonth(-1);
$('nextM').onclick = () => stepMonth(1);
$('vClose').onclick = closeViewer;
$('vPrev').onclick = () => step(-1);
$('vNext').onclick = () => step(1);
document.addEventListener('keydown', e => {
  if (!$('viewer').classList.contains('open')) return;
  if (e.key === 'Escape') closeViewer();
  if (e.key === 'ArrowLeft') step(-1);
  if (e.key === 'ArrowRight') step(1);
});
loadMonths();
</script>
</body>
</html>
