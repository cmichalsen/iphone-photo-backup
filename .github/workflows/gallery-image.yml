name: Build gallery image

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/gallery-image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: web
          push: true
          tags: |
            ghcr.io/cmichalsen/iphone-photo-backup:latest
            ghcr.io/cmichalsen/iphone-photo-backup:${{ github.sha }}
